<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник КБЖУ</title>
<meta name="theme-color" content="#2346D8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one-column phone app — date bar on top, scrolling screen, fixed bottom tabs, bottom sheet for adding food. Numbers set like a kitchen scale readout. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#E8ECEA; --line:#D7DEDA;
  --ink:#16201C; --muted:#5E6B65; --accent:#2346D8; --accent-ink:#FFFFFF;
  --prot:#0E8A73; --fat:#C2830A; --carb:#7A4FD6; --over:#C93B2E; --ok:#1E8A4C;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 8px 24px rgba(22,32,28,.06);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#171D1B; --surface2:#202825; --line:#2C3632;
  --ink:#E7EEEA; --muted:#93A29B; --accent:#7C95FF; --accent-ink:#0B1020;
  --prot:#3CC4A6; --fat:#E5AE3C; --carb:#A88BFF; --over:#FF7A6B; --ok:#4BC984;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#171D1B; --surface2:#202825; --line:#2C3632;
  --ink:#E7EEEA; --muted:#93A29B; --accent:#7C95FF; --accent-ink:#0B1020;
  --prot:#3CC4A6; --fat:#E5AE3C; --carb:#A88BFF; --over:#FF7A6B; --ok:#4BC984;
  --shadow:none; color-scheme:dark}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 0 10px}
header.top h1{font-family:var(--f-disp);font-size:15px;font-weight:700;margin:0;flex:1;text-align:center;letter-spacing:.01em}
header.top h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.banner{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
/* summary */
.summary{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{display:block}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1}
.ring .sub{font-size:11px;color:var(--muted);margin-top:4px}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}
.mrow b{font-weight:600}
.mrow .v{justify-self:end;font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.left-line{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.left-line .num{font-weight:700}
.over{color:var(--over)}
/* meals */
.meal-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.meal-h h3{margin:0;font-size:16px;font-weight:600}
.meal-h .num{color:var(--muted);font-size:13px}
.items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.items li{display:grid;grid-template-columns:1fr auto 32px;gap:2px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.items .nm{min-width:0;overflow-wrap:anywhere}
.items .meta{grid-column:1;font-size:12px;color:var(--muted)}
.items .kc{grid-row:1/3;grid-column:2;font-family:var(--f-num);font-weight:700;font-size:14px}
.items .del{grid-row:1/3;grid-column:3;width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:18px}
.add-btn{margin-top:10px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:10px;font-weight:600;color:var(--accent)}
.empty{font-size:13px;color:var(--muted);margin:6px 0 0}
/* body metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,textarea{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field input.num{font-family:var(--f-num)}
/* workout */
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{list-style:none;margin:0;padding:0}
.ex li{display:grid;grid-template-columns:28px 1fr 96px;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex .nm{font-weight:500}
.ex .pl{grid-column:2;font-size:12px;color:var(--muted)}
.ex input[type=text]{grid-row:1/3;grid-column:3;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-num);font-size:14px;width:100%;min-width:0}
.ex input[type=checkbox]{grid-row:1/3;width:22px;height:22px;accent-color:var(--ok)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{text-align:center;padding:8px 0}
.timer .phase{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.timer .phase.work{color:var(--over)} .timer .phase.rest{color:var(--ok)}
.timer .clock{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1.05}
.timer .what{font-size:18px;font-weight:600;min-height:1.4em}
.timer .next{font-size:13px;color:var(--muted)}
/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:20px;font-weight:700}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}
.chart{width:100%;height:auto;display:block}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{flex:1;margin:0;font-size:17px}
.sheet-b{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.results{list-style:none;margin:0;padding:0}
.results li button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.results .rn{min-width:0;overflow-wrap:anywhere}
.results .rm{font-size:12px;color:var(--muted)}
.results .rk{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-num);font-size:13px;color:var(--muted)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:6px 0 2px}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.preview div{background:var(--surface2);border-radius:10px;padding:8px 4px}
.preview .k{font-size:11px;color:var(--muted)}
.preview .v{font-family:var(--f-num);font-weight:700;font-size:16px}
.unit-toggle{display:flex;gap:6px}
.qty{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 .field input{padding:10px 6px;text-align:center}
.note{font-size:13px;color:var(--muted);margin:0}
.photo-zone{border:1px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.photo-zone p{margin:0}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.checkline{display:flex;align-items:center;gap:8px;font-size:14px}
.checkline input{width:20px;height:20px;accent-color:var(--accent)}
.danger{border:0;background:transparent;color:var(--over);font-weight:600;padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
[hidden]{display:none!important}
.banner.warn{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--fat) 16%,var(--surface));color:var(--ink)}
.banner.warn .chip{flex:none}
.card.notice{border-color:color-mix(in srgb,var(--fat) 55%,var(--line));display:flex;flex-direction:column;gap:8px}
.card.notice p{margin:0}
.week-line{margin-top:6px;font-size:13px;color:var(--muted)}
.meal-actions{display:flex;gap:8px;margin-top:10px}
.meal-actions .add-btn{margin-top:0;flex:1;min-width:0}
.add-btn.alt{flex:none;max-width:62%;color:var(--ink);border-style:solid;background:var(--surface2);border-color:transparent;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items li.tap{cursor:pointer}
.items li.tap:active{background:var(--surface2)}
.metrics.m3{grid-template-columns:1fr 1fr 1fr}
.ex .pl{display:flex;flex-direction:column;gap:2px}
.ex .prev{color:var(--ink);opacity:.75}
.ex .hint{color:var(--ok);font-weight:600}
.rest-clock{font-size:22px;font-weight:700;color:var(--accent);min-width:3ch;text-align:right}
.stats .stat:last-child:nth-child(odd){grid-column:1/-1}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:13px}
.hb .hl{min-width:0;overflow-wrap:anywhere}
.hb .hv{color:var(--muted)}
.hb .bar{grid-column:1/-1}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:4px 6px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num,.tbl th:not(:first-child){text-align:right}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cw{font-size:11px;color:var(--muted);text-align:center}
.cd{position:relative;aspect-ratio:1;border:0;border-radius:8px;background:var(--surface2);font-family:var(--f-num);font-size:13px;color:var(--muted);padding:0}
.cd.ok{background:color-mix(in srgb,var(--ok) 30%,var(--surface));color:var(--ink)}
.cd.under{background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--ink)}
.cd.over{background:color-mix(in srgb,var(--over) 30%,var(--surface));color:var(--ink)}
.cd.future{background:transparent;opacity:.4}
.cd.today{outline:2px solid var(--ink);outline-offset:-2px}
.wdot{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.wdot.static{position:static;display:inline-block}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px}
.lg.ok{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}.lg.under{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}.lg.over{background:color-mix(in srgb,var(--over) 30%,var(--surface))}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.fav{border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);padding:4px;width:40px;height:40px}
.fav[aria-pressed="true"]{color:var(--fat)}
.detail-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
@media (max-width:360px){.metrics.m3{grid-template-columns:1fr 1fr}}
.scan{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.data-btns{display:grid;gap:8px}
.mdbox{width:100%;min-height:180px;font-family:var(--f-num);font-size:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);resize:vertical}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <button class="icon-btn" id="prevDay" aria-label="Предыдущий день">‹</button>
    <h1 id="dateTitle">Сегодня</h1>
    <button class="icon-btn" id="nextDay" aria-label="Следующий день">›</button>
  </header>
  <div id="banner"></div>
  <main id="main"><p class="note">Загружаю записи…</p></main>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Питание</button>
    <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10"/></svg>Тренировка</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>Статистика</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Ещё</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" accept="image/*" capture="environment" id="camInput" class="hidden-input" tabindex="-1" aria-hidden="true">
<input type="file" accept="application/json,.json" id="restoreInput" class="hidden-input" tabindex="-1" aria-hidden="true">

<script>
(function(){
"use strict";
// ---------- goals ----------
const START = "2026-11-05";
const MEALS = ["Завтрак","Обед","Перекус","Ужин"];

// ---------- built-in foods: per 100 g (or 100 ml) ----------
// [id, name, kcal, protein, fat, carbs, unitName, unitGrams]
const BASE_RAW = [
["oat","Овсяные хлопья (сухие)",352,12.3,6.1,59.5],
["buck","Гречка (сухая)",313,12.6,3.3,62.1],
["buckc","Гречка варёная",110,4.2,1.1,21.3],
["rice","Рис (сухой)",344,6.7,0.7,78.9],
["ricec","Рис варёный",116,2.2,0.5,24.9],
["pasta","Макароны (сухие)",344,10.4,1.1,71.5],
["pastac","Макароны варёные",112,3.5,0.4,23.2],
["potato","Картофель",77,2,0.4,16.3,"шт",130],
["bread","Хлеб пшеничный",242,8.1,1,48.8,"ломтик",30],
["rye","Хлеб ржаной",210,6.6,1.2,40.7,"ломтик",30],
["lavash","Лаваш тонкий",236,7.9,1,47.6,"лист",80],
["egg","Яйцо куриное",157,12.7,11.5,0.7,"шт",55],
["chb","Куриная грудка (сырая)",113,23.6,1.9,0.4],
["chbb","Куриная грудка запечённая",137,29,1.8,0],
["cht","Куриное бедро без кожи",161,19.5,9,0],
["chm","Куриный фарш",143,17.4,8.1,0],
["beef","Говядина",187,18.9,12.4,0],
["pollock","Минтай",72,15.9,0.9,0],

function sanitize(o){
  const isObj=x=>x&&typeof x==="object"&&!Array.isArray(x);
  const fin=x=>typeof x==="number"&&isFinite(x);
  const days={},foods={};let bad=0;
  if(isObj(o.days))Object.keys(o.days).forEach(k=>{
    const d=o.days[k];if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!isObj(d)){bad++;return;}
    const items=(Array.isArray(d.items)?d.items:[]).filter(i=>{const ok=isObj(i)&&typeof i.name==="string"&&fin(i.kcal);if(!ok)bad++;return ok;})
      .map(i=>Object.assign({},i,{p:fin(i.p)?i.p:0,f:fin(i.f)?i.f:0,c:fin(i.c)?i.c:0,meal:MEALS.includes(i.meal)?i.meal:"Перекус",id:i.id?String(i.id):uid()}));
    const w=isObj(d.workout)&&WTYPES[d.workout.type]?Object.assign({},d.workout,{log:isObj(d.workout.log)?d.workout.log:{}}):null;
    days[k]={date:k,items,weight:fin(d.weight)?d.weight:null,steps:fin(d.steps)?d.steps:null,waist:fin(d.waist)?d.waist:null,workout:w,note:typeof d.note==="string"?d.note:""};
  });
  if(isObj(o.foods))Object.keys(o.foods).forEach(k=>{const f=o.foods[k];if(isObj(f)&&typeof f.name==="string"&&fin(f.kcal))foods[k]=Object.assign({},f,{id:k,p:fin(f.p)?f.p:0,f:fin(f.f)?f.f:0,c:fin(f.c)?f.c:0});else bad++;});
  return {days,foods,settings:isObj(o.settings)?o.settings:{},lastQty:isObj(o.lastQty)?o.lastQty:{},favs:Array.isArray(o.favs)?o.favs.filter(x=>typeof x==="string"):[],lastBackup:fin(o.lastBackup)?o.lastBackup:null,saved:fin(o.saved)?o.saved:null,bad};
}

// ---------- goals (auto-recalculated from weight) ----------
function weightsUpTo(date){return Object.keys(S.days).filter(d=>d<=date&&S.days[d].weight!=null).sort().map(d=>({d,w:S.days[d].weight}));}
function avgWeight(date,span){
  span=span||7;const from=addDays(date,-(span-1));
  const ws=weightsUpTo(date);const inWin=ws.filter(x=>x.d>=from);
  if(inWin.length)return inWin.reduce((a,b)=>a+b.w,0)/inWin.length;
  if(ws.length)return ws[ws.length-1].w;
  return S.settings.startW;
}
const round5=x=>Math.round(x/5)*5,round50=x=>Math.round(x/50)*50;
function calcGoals(w){
  const st=S.settings;
  const bmr=10*w+6.25*st.height-5*st.age+(st.sex==="f"?-161:5);
  let kcal=round50(bmr*st.activity-st.deficit+(st.adjust||0));
  kcal=Math.max(kcal,st.sex==="f"?1300:1600);
  const p=Math.min(170,Math.max(st.sex==="f"?100:130,round5(1.5*w)));
  const f=Math.max(st.sex==="f"?45:55,round5(0.7*w));
  const c=Math.max(50,round5((kcal-p*4-f*9)/4));
  return {kcal,p,f,c,bmr,w};
}
let GCACHE={};
function goalsFor(date){
  if(GCACHE[date])return GCACHE[date];
  const st=S.settings;let g;
  if(!st.auto&&st.manual&&st.manual.kcal)g=Object.assign({w:avgWeight(date)},st.manual);
  else g=calcGoals(avgWeight(date));
  g.steps=st.steps;g.weight=st.targetW;
  return GCACHE[date]=g;
}

// ---------- helpers for days ----------
const hasFood=d=>!!(S.days[d]&&(S.days[d].items||[]).length)&&d<=today();
function findPrevMeal(date,meal){
  for(let i=1;i<=14;i++){const d=addDays(date,-i),x=S.days[d];if(x&&(x.items||[]).some(it=>it.meal===meal))return {date:d,items:x.items.filter(it=>it.meal===meal)};}
  return null;
}
function dayLabel(d){
  if(d===today())return "сегодня";if(d===addDays(today(),-1))return "вчера";
  const z=dparse(d);return z.getDate()+" "+MON[z.getMonth()];
}
function weekBudget(date){
  const mon=mondayOf(date);let goal=0,eaten=0,logged=0;
  for(let i=0;i<7;i++){const d=addDays(mon,i);if(d>date)break;if(hasFood(d)){goal+=goalsFor(d).kcal;eaten+=totals(S.days[d]).kcal;logged++;}}
  const idx=Math.round((dparse(date)-dparse(mon))/864e5);
  return {balance:goal-eaten,logged,daysLeft:6-idx};
}
function plateauInfo(){
  const t=today(),st=S.settings;
  const win=(a,b)=>Object.keys(S.days).filter(d=>d>=addDays(t,-b)&&d<=addDays(t,-a)&&S.days[d].weight!=null).map(d=>S.days[d].weight);
  const A=win(0,6),B=win(14,20);
  if(A.length<2||B.length<2)return null;
  const avgA=A.reduce((x,y)=>x+y,0)/A.length,avgB=B.reduce((x,y)=>x+y,0)/B.length;
  if(avgA-avgB>-0.3&&st.plateauHide!==mondayOf(t))return {diff:avgA-avgB};
  return null;
}
function backupDue(){
  const ds=Object.keys(S.days).filter(hasFood);if(ds.length<3)return 0;
  const since=S.lastBackup||dparse(ds.sort()[0]).getTime();
  const days=Math.floor((Date.now()-since)/864e5);
  return days>=7?days:0;
}

// total reps (or seconds) from text like "3 × 12", "12, 10, 8", "3×40 с"
function parseVolume(text){
  if(!text)return null;
  const t=String(text).toLowerCase().replace(/,/g," ").replace(/[–—]/g,"-");
  const secs=/\d\s*(с|сек)\b/.test(t)||/\bс\b/.test(t);
  let total=0,found=false;
  const re=/(\d+)\s*[×xх*]\s*(\d+)(?:\s*-\s*(\d+))?/g;let m,rest=t;
  while((m=re.exec(t))){total+=Number(m[1])*Number(m[2]);found=true;rest=rest.replace(m[0]," ");}
  if(!found){const nums=rest.match(/\d+/g);if(nums){nums.forEach(n=>{total+=Number(n);});found=true;}}
  return found&&total>0?{v:total,secs}:null;
}

}

function paintRest(){const b=document.getElementById("restBox");if(b)b.textContent=rest.left>0?Math.floor(rest.left/60)+":"+pad(rest.left%60):(rest.done?"Подход!":"");}
function startRest(sec){

function buildTimerSteps(){

let actx=null,wake=null;
function beep(f,d){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function tick(){
  if(!timer.running)return;

  while(timer.step<timer.steps.length&&now>=timer.endAt){timer.step++;changed=true;if(timer.step<timer.steps.length)timer.endAt+=timer.steps[timer.step].sec*1000;}
  if(timer.step>=timer.steps.length){

  if(changed)beep(timer.steps[timer.step].kind==="work"?880:520,.35);

}
function stopTimer(){if(timer.running)timer.pausedLeft=Math.max(0,timer.endAt-Date.now());timer.running=false;clearInterval(timer.h);timer.h=null;if(wake){wake.release().catch(()=>{});wake=null;}}
async function startTimer(){

  timer.endAt=Date.now()+(timer.pausedLeft!=null?timer.pausedLeft:timer.left*1000);timer.pausedLeft=null;

// ---------- statistics ----------
const SHORT_MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const fd=d=>{const z=dparse(d);return z.getDate()+" "+SHORT_MON[z.getMonth()];};
function statDates(){
  const end=today();let start;
  if(S.statRange)start=addDays(end,-(S.statRange-1));
  else{const ks=Object.keys(S.days).sort();start=ks.length?(ks[0]<end?ks[0]:end):end;}
  const out=[];for(let d=start;d<=end;d=addDays(d,1))out.push(d);
  return out;
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function regression(pts){ // pts [{x(days),y}]
  const n=pts.length;if(n<2)return null;
  const mx=avg(pts.map(p=>p.x)),my=avg(pts.map(p=>p.y));
  let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)*(p.x-mx);});
  if(!sxx)return null;const k=sxy/sxx;return {k,b:my-k*mx};
}
function forecast(){
  const t=today(),from=addDays(t,-27);
  const ws=Object.keys(S.days).filter(d=>d>=from&&S.days[d].weight!=null).sort().map(d=>({x:(dparse(d)-dparse(from))/864e5,y:S.days[d].weight,d}));
  if(ws.length<4||ws[ws.length-1].x-ws[0].x<10)return {state:"few",n:ws.length};
  const r=regression(ws);if(!r)return {state:"few",n:ws.length};
  const xNow=(dparse(t)-dparse(from))/864e5,cur=r.k*xNow+r.b,perWeek=r.k*7,target=S.settings.targetW;
  if(cur<=target)return {state:"done",cur,perWeek};
  if(r.k>=-0.01)return {state:"flat",cur,perWeek};
  const days=Math.round((target-cur)/r.k);
  return {state:"ok",cur,perWeek,date:addDays(t,days),days};
}

function axisDates(x,s0,s1,W,l,r,H){
  const span=Math.max(1,(dparse(s1)-dparse(s0))/864e5);let out="";
  const n=Math.min(5,Math.max(2,Math.round(span/7)+1));
  for(let i=0;i<n;i++){const d=addDays(s0,Math.round(span*i/(n-1)));const anchor=i===0?"start":i===n-1?"end":"middle";out+='<text x="'+x(d)+'" y="'+(H-6)+'" text-anchor="'+anchor+'" font-size="10" fill="var(--muted)">'+fd(d)+"</text>";}
  return out;
}
// line chart for weight / waist / strength
function lineChart(pts,o){
  if(pts.length<2)return '<p class="note">'+esc(o.empty||"Нужно хотя бы два значения.")+"</p>";
  const W=340,H=o.h||190,l=38,r=12,t=14,b=24;
  const s0=o.from||pts[0].d,s1=o.to||pts[pts.length-1].d,span=Math.max(1,(dparse(s1)-dparse(s0))/864e5);
  const ys=pts.map(p=>p.y).concat(o.target!=null?[o.target]:[]).concat(o.fc?[o.fc.y]:[]);
  let lo=Math.min(...ys),hi=Math.max(...ys);const pad0=Math.max((hi-lo)*0.12,o.minPad||1);lo=Math.floor(lo-pad0);hi=Math.ceil(hi+pad0);
  const x=d=>l+(W-l-r)*Math.min(1,Math.max(0,(dparse(d)-dparse(s0))/864e5/span)),y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(o.label||"")+'">';
  const rng=hi-lo,step=rng>40?10:rng>16?4:rng>8?2:1;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(l-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-num)">'+v+"</text>";
  if(o.target!=null)s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(o.target)+'" y2="'+y(o.target)+'" stroke="var(--ok)" stroke-dasharray="4 3"/><text x="'+(W-r)+'" y="'+(y(o.target)-4)+'" text-anchor="end" font-size="10" fill="var(--ok)">цель '+r1(o.target)+"</text>";
  let line=pts;
  if(o.avg){line=pts.map(p=>{const w=pts.filter(q=>q.d<=p.d&&(dparse(p.d)-dparse(q.d))/864e5<7);return {d:p.d,y:avg(w.map(q=>q.y))};});}
  s+='<path d="'+line.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+","+y(p.y).toFixed(1)).join(" ")+'" fill="none" stroke="'+(o.color||"var(--accent)")+'" stroke-width="2.5" stroke-linejoin="round"/>';
  if(o.fc){const lp=line[line.length-1];s+='<path d="M'+x(lp.d).toFixed(1)+","+y(lp.y).toFixed(1)+" L"+x(o.fc.d).toFixed(1)+","+y(o.fc.y).toFixed(1)+'" stroke="'+(o.color||"var(--accent)")+'" stroke-width="2" stroke-dasharray="3 4" fill="none" opacity=".7"/>';}
  pts.forEach(p=>{s+='<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="'+(o.avg?2.6:3.4)+'" fill="'+(o.avg?"var(--muted)":(o.color||"var(--accent)"))+'"><title>'+fd(p.d)+": "+r1(p.y)+" "+(o.unit||"")+"</title></circle>";});
  s+=axisDates(x,s0,s1,W,l,r,H)+"</svg>";
  return s;
}
// bar chart by day (weekly averages for long periods)
function barChart(dates,valFn,goalFn,o){
  let bars=dates.map(d=>({d,v:valFn(d),g:goalFn?goalFn(d):null,label:fd(d)}));
  if(dates.length>45){const wk={};bars.forEach(b=>{const m=mondayOf(b.d);(wk[m]=wk[m]||[]).push(b);});
    bars=Object.keys(wk).sort().map(m=>{const vs=wk[m].filter(b=>b.v!=null);return {d:m,v:vs.length?avg(vs.map(b=>b.v)):null,g:vs.length&&goalFn?avg(vs.map(b=>b.g)):(goalFn?goalFn(m):null),label:fd(m),week:true};});}
  const vals=bars.filter(b=>b.v!=null);
  if(!vals.length)return '<p class="note">'+esc(o.empty||"Нет данных за период.")+"</p>";
  const W=340,H=o.h||170,l=40,r=6,t=12,b=24;
  const mx=Math.max(...bars.map(b=>Math.max(b.v||0,b.g||0)))*1.12||1;
  const y=v=>t+(H-t-b)*(1-v/mx),bw=(W-l-r)/bars.length;
  let s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(o.label||"")+'">';
  const step=mx>8000?4000:mx>4000?2000:mx>2400?1000:mx>1000?500:mx>300?100:mx>120?50:mx>40?20:10;
  for(let v=0;v<=mx;v+=step)s+='<line x1="'+l+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(l-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-num)">'+(v>=10000?(v/1000)+"k":v)+"</text>";
  bars.forEach((bb,i)=>{if(bb.v==null)return;const x=l+i*bw+bw*.15,ww=Math.max(1.5,bw*.7);
    const over=o.over&&bb.g&&bb.v>bb.g*1.05,good=o.reach&&bb.g&&bb.v>=bb.g;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y(bb.v).toFixed(1)+'" width="'+ww.toFixed(1)+'" height="'+(y(0)-y(bb.v)).toFixed(1)+'" rx="'+(bw>8?2:0)+'" fill="'+(over?"var(--over)":good?"var(--ok)":(o.color||"var(--accent)"))+'" opacity=".85"><title>'+(bb.week?"неделя с ":"")+bb.label+": "+r0(bb.v)+" "+(o.unit||"")+(bb.g?" (норма "+r0(bb.g)+")":"")+"</title></rect>";});
  if(goalFn){s+='<path d="'+bars.map((bb,i)=>(i?"L":"M")+(l+i*bw).toFixed(1)+","+y(bb.g).toFixed(1)+" L"+(l+(i+1)*bw).toFixed(1)+","+y(bb.g).toFixed(1)).join(" ")+'" fill="none" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1"/>';
    s+='<text x="'+(W-2)+'" y="'+(y(bars[bars.length-1].g)-4)+'" text-anchor="end" font-size="10" fill="var(--ink)">'+esc(o.goalLabel||"норма")+"</text>";}
  const n=Math.min(5,bars.length);
  for(let i=0;i<n;i++){const k=n===1?0:Math.round((bars.length-1)*i/(n-1));const anchor=i===0?"start":i===n-1?"end":"middle";const cx=i===0?l:i===n-1?W-r:l+(k+.5)*bw;s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="'+anchor+'" font-size="10" fill="var(--muted)">'+bars[k].label+"</text>";}
  if(dates.length>45)s+='<text x="'+l+'" y="10" font-size="10" fill="var(--muted)">средние по неделям</text>';
  return s+"</svg>";
}
function hbars(rows,unit){ // [{label,v,max,color,extra}]
  const mx=Math.max(...rows.map(r=>r.max||r.v),1);
  return '<div class="hbars">'+rows.map(r=>'<div class="hb"><span class="hl">'+esc(r.label)+'</span><span class="hv num">'+esc(r.text!=null?r.text:r0(r.v)+(unit?" "+unit:""))+'</span><div class="bar"><i style="width:'+Math.min(100,r.v/mx*100)+"%;background:"+(r.color||"var(--accent)")+'"></i></div></div>').join("")+"</div>";
}
function dayStatus(d){
  if(!hasFood(d))return "none";const k=totals(S.days[d]).kcal,g=goalsFor(d).kcal;
  return k>g*1.05?"over":k<g*0.85?"under":"ok";
}
function streaks(){
  const ds=Object.keys(S.days).filter(hasFood).sort();if(!ds.length)return {cur:0,best:0};
  let best=1,run=1;for(let i=1;i<ds.length;i++){run=ds[i]===addDays(ds[i-1],1)?run+1:1;best=Math.max(best,run);}
  let cur=0,d=hasFood(today())?today():addDays(today(),-1);while(hasFood(d)){cur++;d=addDays(d,-1);}
  return {cur,best};
}
function calendarHtml(){
  const t=today(),ym=S.calMonth||t.slice(0,7),[Y,M]=ym.split("-").map(Number);
  const first=new Date(Y,M-1,1),shift=(first.getDay()+6)%7,daysIn=new Date(Y,M,0).getDate();
  let h='<div class="cal-head"><button class="icon-btn" data-act="cal" data-dir="-1" aria-label="Предыдущий месяц">‹</button><b>'+["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"][M-1]+" "+Y+'</b><button class="icon-btn" data-act="cal" data-dir="1" aria-label="Следующий месяц"'+(ym>=t.slice(0,7)?" disabled":"")+'>›</button></div><div class="cal">';
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(w=>{h+='<span class="cw">'+w+"</span>";});
  for(let i=0;i<shift;i++)h+="<span></span>";
  for(let dd=1;dd<=daysIn;dd++){const d=Y+"-"+pad(M)+"-"+pad(dd),st=d>t?"future":dayStatus(d),wk=S.days[d]&&S.days[d].workout&&S.days[d].workout.done;
    h+='<button class="cd '+st+(d===t?" today":"")+'" data-act="goto-day" data-d="'+d+'"'+(d>t?" disabled":"")+' aria-label="'+dd+'">'+dd+(wk?'<i class="wdot"></i>':"")+"</button>";}
  h+='</div><div class="legend"><span><i class="lg ok"></i>в норме</span><span><i class="lg under"></i>меньше</span><span><i class="lg over"></i>перебор</span><span><i class="wdot static"></i>тренировка</span></div>';
  return h;
}
function isFullDay(d){return hasFood(d)&&d<today()&&totals(S.days[d]).kcal>=goalsFor(d).kcal*0.4;}
function viewStats(){
  const dates=statDates(),t=today();
  const anyData=Object.keys(S.days).some(d=>d<=t&&(hasFood(d)||S.days[d].weight!=null||S.days[d].waist!=null||(S.days[d].workout&&S.days[d].workout.done)));
  if(!anyData)return '<div class="stack"><section class="card"><h2>Пока пусто</h2><p style="margin:0 0 8px">Здесь появятся графики веса, калорий, БЖУ, тренировок и силы.</p><p class="note">Начни с вкладки «Питание»: запиши еду и утренний вес. Средние и прогноз появятся через несколько дней записей.</p><button class="primary" style="margin-top:12px" data-act="tab" data-tab="today">Перейти к питанию</button></section></div>';
  const logged=dates.filter(isFullDay),partial=dates.filter(d=>hasFood(d)&&!isFullDay(d)&&d<t).length;

  }
  // workouts
  const byType={};wdone.forEach(d=>{const ty=S.days[d].workout.type;byType[ty]=(byType[ty]||0)+1;});
  h+='<section class="card"><h2>Тренировки</h2>'+(wdone.length?hbars(["A","B","cardio","walk","stretch"].filter(k=>byType[k]).map(k=>({label:WTYPES[k].name,v:byType[k],text:byType[k]+" раз"})),""):'<p class="note">За период тренировок не отмечено.</p>');
  const minutes=wdone.reduce((s,d)=>{const w=S.days[d].workout;return s+(w.type==="walk"?(w.min||60):w.type==="cardio"?cardioMin(d):w.type==="stretch"?15:35);},0);
  if(wdone.length)h+='<p class="note" style="margin-top:8px">Примерно '+Math.round(minutes/60*10)/10+" ч активности за период.</p>";
  h+="</section>";
  // strength
  const allEx=WTYPES.A.ex.map(e=>["A",e]).concat(WTYPES.B.ex.map(e=>["B",e]));
  const cur=allEx.find(x=>x[1][0]===S.statEx)||allEx[1];
  const hist=exHistory(cur[0],cur[1][0]).filter(d=>d>=dates[0]);
  const pts=hist.map(d=>{const v=exVolume(d,cur[0],cur[1][0]);return v?{d,y:v.v,secs:v.secs}:null;}).filter(Boolean);
  const secs=pts.length&&pts[0].secs;
  h+='<section class="card"><h2>Сила: всего за тренировку</h2><div class="chips">'+allEx.map(x=>'<button class="chip" data-act="sex" data-ex="'+x[1][0]+'" aria-pressed="'+(x[1][0]===cur[1][0])+'">'+esc(x[1][1].replace(/ \(.*\)/,"").replace(" / от стула",""))+"</button>").join("")+"</div>";
  h+=lineChart(pts,{unit:secs?"с":"повт.",label:"Сила",color:"var(--prot)",minPad:2,from:dates[0],to:dates[dates.length-1],empty:"Отмечай это упражнение на вкладке «Тренировка», лучше с числами (например, «3×12»)."});
  if(pts.length>=2)h+='<p class="note">Сумма '+(secs?"секунд":"повторений")+' во всех подходах. Было '+r0(pts[0].y)+", стало "+r0(pts[pts.length-1].y)+(pts[pts.length-1].y>pts[0].y?" — растёшь.":".")+"</p>";
  h+="</section>";
  // steps
  h+='<section class="card"><h2>Шаги</h2>'+barChart(dates,d=>S.days[d]&&S.days[d].steps!=null?S.days[d].steps:null,()=>S.settings.steps,{reach:true,unit:"шагов",label:"Шаги по дням",goalLabel:"цель",h:150,empty:"Вписывай шаги на вкладке «Питание»."})+"</section>";
  // calendar
  h+='<section class="card"><h2>Календарь</h2>'+calendarHtml()+"</section>";
  h+="</div>";
  return h;
}

function cardioMin(d){const c=CARDIO_PHASE[phaseOf(d)];return Math.round(c.rounds*5*(c.work+c.rest)/60);}

const SUGGEST_BASE=[["tvor5",200],["tvor0",200],["chbb",150],["egg",110],["kefir",500],["tuna",170],["yog",200],["u175180",150],["u171304",170],["u173709",130],["u172476",150],["u170567",30]];
function suggestions(){
  const G=goalsFor(S.date),t=totals(getDay(S.date)),left=G.kcal-t.kcal,pl=G.p-t.p;
  const c=[];
  PRESETS.forEach(f=>c.push({f,qty:1,unit:"portion",kcal:f.kcal,p:f.p,text:"порция"}));
  Object.values(S.foods).filter(f=>f.kind==="recipe").forEach(f=>{const g=f.unitG||250;c.push({f:Object.assign({src:"custom"},f),qty:f.unitG?1:g,unit:f.unitG?"u":"g",kcal:f.kcal*g/100,p:f.p*g/100,text:f.unitG?"порция "+r0(g)+" г":g+" г"});});
  SUGGEST_BASE.forEach(([id,g])=>{const f=BASE[id];if(f)c.push({f,qty:g,unit:"g",kcal:f.kcal*g/100,p:f.p*g/100,text:g+" г"});});
  const fit=c.filter(x=>x.kcal<=left+40&&x.kcal>=40);
  fit.forEach(x=>{x.score=pl>10?Math.min(x.p,pl)/Math.max(x.kcal,60)*100-Math.abs(left-x.kcal)/left*3:x.kcal/left;});
  fit.sort((a,b)=>b.score-a.score);
  return {left,pl,list:fit.slice(0,8)};
}
function sheetSuggest(){
  const s=suggestions();
  let h='<p style="margin:0">Осталось <b class="num">'+r0(s.left)+" ккал</b>"+(s.pl>0?" и <b class=\"num\">"+r0(s.pl)+" г</b> белка":"")+".</p><p class=\"note\">"+(s.pl>10?"Сначала варианты, где больше белка на калорию.":"Белок набран — подбираю по калориям.")+"</p>";
  if(!s.list.length)return h+'<p class="note">Под остаток ничего не подходит целиком — можно взять половину порции любимого блюда.</p>';
  h+='<ul class="results">'+s.list.map((x,i)=>'<li><button data-act="sg-pick" data-i="'+i+'"><span class="rn">'+esc(x.f.name)+'</span><span class="rm">'+esc(x.text)+" · белок "+r0(x.p)+' г</span><span class="rk">'+r0(x.kcal)+" ккал</span></button></li>").join("")+"</ul>";
  sheet.sg=s.list;
  return h;
}

let sheet=null; // {meal, view:'search'|'scan'|'manual'|'detail'|'recipe'|'export'|'restore', mode:null|'ingredient', q, food, qty, unit, scan, draft}
function openSheet(meal){sheet={meal,view:"search",q:"",food:null};renderSheet();setTimeout(()=>{const i=document.getElementById("q");if(i)i.focus();},50);}

function allFoods(){return Object.values(BASE).concat(Object.values(S.foods).map(f=>Object.assign({src:"custom"},f)));}
function recentFoods(){
  const seen=new Set(),out=[];
  Object.keys(S.days).sort().reverse().slice(0,21).forEach(d=>{(S.days[d].items||[]).slice().reverse().forEach(i=>{const k=i.ref?i.ref.src+":"+i.ref.id:i.name;if(seen.has(k)||out.length>=8)return;seen.add(k);const f=resolveRef(i);if(f)out.push(f);});});
  return out;
}
function resolveRef(item){
  const r=item.ref;if(!r)return null;
  if(r.src==="base")return BASE[r.id]||null;
  if(r.src==="preset")return PRESET[r.id]||null;
  if(r.src==="custom")return S.foods[r.id]?Object.assign({src:"custom"},S.foods[r.id]):(item.per100?Object.assign({src:"custom",id:r.id,name:item.name},item.per100):null);
  return null;
}
const norm=t=>String(t).toLowerCase().replace(/ё/g,"е");
function foodRow(f){
  const meta=f.kind==="recipe"?"моё блюдо"+(f.unitG?" · порция "+r0(f.unitG)+" г":"")+" · Б "+r1(f.p)+" Ж "+r1(f.f)+" У "+r1(f.c)+" на 100 г":f.approx?"≈ средний рецепт · Б "+r1(f.p)+" Ж "+r1(f.f)+" У "+r1(f.c)+" на 100 г":f.portion?r0(f.p)+" г белка · порция":"на 100 г · Б "+r1(f.p)+" Ж "+r1(f.f)+" У "+r1(f.c);
  return '<li><button data-act="pick" data-src="'+f.src+'" data-id="'+esc(f.id)+'"><span class="rn">'+esc(f.name)+'</span><span class="rm">'+esc(meta)+'</span><span class="rk">'+r0(f.kcal)+(f.portion?" ккал":" ккал/100")+"</span></button></li>";
}
function sheetSearch(){
  const q=(sheet.q||"").trim().toLowerCase();
  let h='<div class="field"><label for="q">Поиск продукта</label><input id="q" type="search" placeholder="гречка, хурма, борщ, кешью…" value="'+esc(sheet.q||"")+'" autocomplete="off"></div>';
  if(q){
    const words=norm(q).split(/\s+/).filter(Boolean);
    const scored=[];
    allFoods().concat(sheet.mode==="ingredient"?[]:PRESETS).forEach(f=>{
      const n=norm(f.name),sy=norm(f.syn||""),bc=f.barcode||"";
      let score=0;
      for(const w of words){
        if(n.startsWith(w))score+=0;
        else if((" "+n).includes(" "+w)||n.includes("("+w))score+=1;
        else if(n.includes(w))score+=2;
        else if((" "+sy).includes(" "+w))score+=3;
        else if(bc.includes(w))score+=1;
        else return;
      }
      if(f.src==="custom")score-=0.5;
      if(f.src==="base"&&!/^u/.test(f.id))score-=0.3;
      scored.push([score+n.length/200,f]);
    });
    const res=scored.sort((a,b)=>a[0]-b[0]).slice(0,40).map(x=>x[1]);
    h+=res.length?'<ul class="results">'+res.map(foodRow).join("")+"</ul>":'<p class="note">Ничего не нашёл.'+(sheet.mode==="ingredient"?" Добавь этот продукт через вкладку «Вручную» или «Штрихкод», а потом вернись к блюду.":" Собери своё блюдо из ингредиентов, отсканируй штрихкод или добавь продукт вручную.")+"</p>";
    if(sheet.mode!=="ingredient")h+='<button class="secondary" data-act="recipe-new">+ Создать блюдо «'+esc(sheet.q.trim())+'»</button>';
  } else {
    const all=Object.values(S.foods).map(f=>Object.assign({src:"custom"},f));
    const dishes=all.filter(f=>f.kind==="recipe").sort((a,b)=>a.name.localeCompare(b.name,"ru"));
    const mine=all.filter(f=>f.kind!=="recipe").sort((a,b)=>a.name.localeCompare(b.name,"ru"));
    if(sheet.mode==="ingredient"){
      const rec=recentFoods().filter(f=>!f.portion);
      if(rec.length)h+='<div class="grp">Недавние</div><ul class="results">'+rec.map(foodRow).join("")+"</ul>";
      if(mine.length)h+='<div class="grp">Мои продукты</div><ul class="results">'+mine.map(foodRow).join("")+"</ul>";
      h+='<p class="note">Начни вводить название ингредиента: в базе около 650 продуктов.</p>';
      return h;
    }
    const favs=S.favs.map(favFood).filter(Boolean);
    h+='<div class="row2"><button class="secondary" data-act="recipe-new">+ Своё блюдо</button><button class="secondary" data-act="view" data-view="quick">Просто калории</button></div>';
    if(favs.length)h+='<div class="grp">★ Избранное</div><ul class="results">'+favs.map(foodRow).join("")+"</ul>";
    if(RD&&RD.ingredients.length)h+='<button class="primary" data-act="recipe-continue">Продолжить блюдо «'+esc(RD.name||"без названия")+'» ('+RD.ingredients.length+' ингр.)</button>';
    const rec=recentFoods().filter(f=>!S.favs.includes(f.src+":"+f.id));
    if(rec.length)h+='<div class="grp">Недавние</div><ul class="results">'+rec.map(foodRow).join("")+"</ul>";
    if(dishes.length)h+='<div class="grp">Мои блюда</div><ul class="results">'+dishes.map(foodRow).join("")+"</ul>";
    if(mine.length)h+='<div class="grp">Мои продукты</div><ul class="results">'+mine.map(foodRow).join("")+"</ul>";
    h+='<div class="grp">Блюда из плана</div><ul class="results">'+PRESETS.map(foodRow).join("")+"</ul>";
  }
  return h;
}
function sheetScan(){

function recipeCalc(rd){
  const t={kcal:0,p:0,f:0,c:0};let raw=0;
  (rd.ingredients||[]).forEach(i=>{const g=num(i.g)||0;raw+=g;["kcal","p","f","c"].forEach(k=>t[k]+=(i[k]||0)*g/100);});
  const cooked=num(rd.cookedG),W=isFinite(cooked)&&cooked>0?cooked:raw;
  const portions=num(rd.portions),pn=isFinite(portions)&&portions>0?portions:null;
  const per100={kcal:0,p:0,f:0,c:0};if(W>0)["kcal","p","f","c"].forEach(k=>per100[k]=t[k]/W*100);
  return {t,raw,W,per100,pn,portionG:pn&&W?W/pn:null};
}
function recipeTotalsHtml(){
  const c=recipeCalc(RD);
  if(!RD.ingredients.length)return '<p class="note">Добавь ингредиенты, и здесь появится КБЖУ блюда.</p>';
  const row=(label,o,k,extra)=>'<div class="grp">'+label+(extra?' <span style="text-transform:none;letter-spacing:0;font-weight:500">· '+extra+"</span>":"")+'</div><div class="preview">'+previewHtml(o,k)+"</div>";
  let h=row("Всё блюдо",c.t,1,r0(c.W)+" г");
  h+=row("На 100 г",c.per100,1);
  if(c.portionG)h+=row("Порция",c.per100,c.portionG/100,r0(c.portionG)+" г");
  return h;
}

// ---------- barcode scanner ----------
const HAS_BD="BarcodeDetector" in window;
let scanStream=null,scanLoop=null,detector=null;
function stopScan(){
  if(scanLoop){clearTimeout(scanLoop);scanLoop=null;}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
}
function getDetector(){
  if(!HAS_BD)return null;
  if(!detector){try{detector=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});}catch(e){detector=null;}}
  return detector;
}
async function startScan(){
  if(!HAS_BD||!getDetector()){document.getElementById("camInput").click();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){sheet.scan={state:"error",msg:"Камера недоступна в этом браузере. Введи цифры штрихкода вручную."};renderSheet();return;}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){sheet.scan={state:"error",msg:e&&e.name==="NotAllowedError"?"Нет доступа к камере. Разреши его в настройках сайта (значок замка в адресной строке).":"Не удалось включить камеру."};renderSheet();return;}
  if(!sheet){stopScan();return;}
  sheet.scan={state:"live"};renderSheet();
  const v=document.getElementById("scanVideo");v.srcObject=scanStream;
  try{await v.play();}catch(e){}
  const loop=async()=>{
    if(!scanStream||!sheet)return;
    try{const r=await detector.detect(v);if(r&&r.length){const code=r[0].rawValue;stopScan();if(navigator.vibrate)navigator.vibrate(80);lookupBarcode(code);return;}}catch(e){}
    scanLoop=setTimeout(loop,250);
  };
  loop();
}
async function scanPhoto(file){
  if(!file||!sheet)return;
  const det=getDetector();
  if(!det){sheet.scan={state:"error",msg:"Этот браузер не умеет распознавать штрихкоды. Введи цифры под штрихкодом вручную."};renderSheet();return;}
  try{const bmp=await createImageBitmap(file);const r=await det.detect(bmp);if(r&&r.length){lookupBarcode(r[0].rawValue);return;}}catch(e){}
  sheet.scan={state:"error",msg:"Не нашёл штрихкод на фото. Попробуй ближе и ровнее или введи цифры."};renderSheet();
}
async function lookupBarcode(code){
  code=String(code||"").replace(/\D/g,"");
  if(code.length<6){toast("Проверь цифры штрихкода");return;}
  const hit=Object.values(S.foods).find(f=>f.barcode===code);
  if(hit){sheet.view="detail";sheet.food=Object.assign({src:"custom"},hit);sheet.qty=null;sheet.unit=hit.unitG?"u":null;sheet.scan=null;renderSheet();toast("Нашёл в «Моих продуктах»");return;}
  sheet.scan={state:"busy",msg:"Ищу "+code+" в базе Open Food Facts…"};renderSheet();
  let p=null;
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
    const res=await fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,product_name_ru,generic_name_ru,brands,quantity,nutriments,serving_quantity",{signal:ctl.signal});
    clearTimeout(to);
    const j=await res.json();if(j&&j.status===1&&j.product)p=j.product;
  }catch(e){
    if(!sheet)return;
    sheet.view="manual";sheet.scan=null;sheet.draft={barcode:code,save:true};renderSheet();
    toast(navigator.onLine===false?"Нет интернета — впиши КБЖУ с этикетки":"База не ответила — впиши КБЖУ с этикетки");return;
  }
  if(!sheet)return;
  const d={barcode:code,save:true};
  if(p){
    const n=p.nutriments||{};
    const name=(p.product_name_ru||p.product_name||p.generic_name_ru||"").trim();
    const brand=(p.brands||"").split(",")[0].trim();
    d.name=brand&&name&&!name.toLowerCase().includes(brand.toLowerCase())?name+" «"+brand+"»":(name||brand);
    let kc=num(n["energy-kcal_100g"]);if(!isFinite(kc)&&isFinite(num(n["energy_100g"])))kc=num(n["energy_100g"])/4.184;
    const vals={kcal:kc,p:num(n.proteins_100g),f:num(n.fat_100g),c:num(n.carbohydrates_100g)};
    Object.keys(vals).forEach(k=>{d[k]=isFinite(vals[k])?Math.round(vals[k]*10)/10:null;});
    const pack=num(String(p.quantity||"").replace(/[^\d.,]/g,""));if(isFinite(pack)&&/г|g|мл|ml/i.test(p.quantity||""))d.pack=pack;
    d.fromOff=isFinite(vals.kcal);
    if(d.pack&&d.pack<=120)d.qty=d.pack;
  }
  sheet.view="manual";sheet.scan=null;sheet.draft=d;renderSheet();
}

function download(name,text,type){
  const b=new Blob([text],{type:type||"application/octet-stream"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
async function backup(){
  const name="kbju-backup-"+today()+".json",text=JSON.stringify(snapshot(),null,1);
  let shared=false;
  try{const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Резервная копия КБЖУ"});shared=true;}}
  catch(e){if(e&&e.name==="AbortError"){toast("Копия не сохранена");return;}}
  if(!shared)download(name,text,"application/json");
  S.lastBackup=Date.now();persist();renderMain();
  toast(shared?"Копия отправлена":"Копия сохранена в «Загрузки»");
}
function readRestore(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let o=null;try{o=JSON.parse(fr.result);}catch(e){}
    if(!o||typeof o.days!=="object"||typeof o.foods!=="object"||Array.isArray(o.days)){toast("Это не файл резервной копии КБЖУ");return;}
    const c=sanitize(o);if(!Object.keys(c.days).length&&!Object.keys(c.foods).length){toast("В файле нет записей, которые можно восстановить");return;}
    c.settings=o.settings;c.raw=o;sheet={meal:MEALS[0],view:"restore",restore:c};renderSheet();
  };
  fr.readAsText(file);
}
function exportMd(range){
  let dates=Object.keys(S.days).sort().reverse();
  if(range==="day")dates=dates.filter(d=>d===S.date);
  else if(range==="week"){const m=mondayOf(S.date),e=addDays(m,6);dates=dates.filter(d=>d>=m&&d<=e);}
  dates=dates.filter(d=>{const x=S.days[d];return (x.items&&x.items.length)||x.weight!=null||x.steps!=null||x.waist!=null||(x.workout&&x.workout.done);});
  if(!dates.length)return "Нет записей за выбранный период.";
  const cell=s=>String(s).replace(/\|/g,"/");
  return dates.map(d=>{
    const day=S.days[d],dd=dparse(d),t=totals(day);
    let s="### "+d+", "+WD[dd.getDay()]+" · неделя "+weekNo(d)+"\n\n";
    s+="**Вес:** "+(day.weight!=null?r1(day.weight)+" кг":"—")+" · **Шаги:** "+(day.steps!=null?day.steps:"—")+(day.waist!=null?" · **Талия:** "+r1(day.waist)+" см":"")+"\n\n#### Питание\n\n";
    const its=(day.items||[]).slice().sort((a,b)=>MEALS.indexOf(a.meal)-MEALS.indexOf(b.meal));
    if(its.length){
      s+="| Приём | Продукт | Кол-во | Ккал | Б | Ж | У |\n| --- | --- | --- | --- | --- | --- | --- |\n";
      its.forEach(i=>{s+="| "+i.meal+" | "+cell(i.name)+" | "+cell(i.qtyText||"")+" | "+r0(i.kcal)+" | "+r0(i.p)+" | "+r0(i.f)+" | "+r0(i.c)+" |\n";});
      const G=goalsFor(d);s+="\n**Итог:** "+r0(t.kcal)+" / "+G.kcal+" ккал · Б "+r0(t.p)+" / "+G.p+" · Ж "+r0(t.f)+" / "+G.f+" · У "+r0(t.c)+" / "+G.c+"\n\n";
    } else s+="Нет записей.\n\n";
    const w=day.workout;
    if(w&&w.type!=="rest"){
      const wt=WTYPES[w.type],ph=phaseOf(d);
      s+="#### Тренировка: "+wt.name+(w.done?" — выполнено ✓":" — не выполнено")+"\n\n";
      if(w.type==="walk")s+="Прогулка: "+(w.min!=null?w.min+" мин":"—")+"\n\n";
      else if(w.type==="cardio")s+=CARDIO_PHASE[ph].rounds+" круга · "+CARDIO_PHASE[ph].work+"/"+CARDIO_PHASE[ph].rest+" с\n\n";
      else if(wt.ex.length){
        s+="| Упражнение | План | Сделал |\n| --- | --- | --- |\n";
        wt.ex.forEach(e=>{const lg=(w.log||{})[e[0]]||{};s+="| "+cell(e[1])+" | "+(e[2]?e[2][ph]:"30 с")+" | "+(lg.ok?(lg.v?cell(lg.v):"✓ по плану"):"—")+" |\n";});
        s+="\n";
      }
    } else if(w&&w.type==="rest")s+="#### Тренировка: отдых\n\n";
    return s+"---\n";
  }).join("\n");
}

    if(a==="edit-save"){const before=clone(getDay(S.date));Object.assign(it,v,{meal});saveDay(day);closeSheet();toast("Запись изменена",()=>saveDay(before));return;}
    const to=document.getElementById("eDate").value;if(!to){toast("Выбери день");return;}
    const td=getDay(to);td.items=td.items||[];td.items.push(Object.assign(clone(it),v,{meal,id:uid(),ts:Date.now()}));saveDay(td);closeSheet();toast("Скопировано на "+dayLabel(to));}
  else if(a==="unit"){sheet.unit=b.dataset.unit;sheet.qty=null;renderSheet();}
  else if(a==="setqty"){sheet.qty=Number(b.dataset.v);renderSheet();}
  else if(a==="detail-add"){const f=sheet.food,unit=sheet.unit||(f.portion?"portion":"g");let q=num(document.getElementById("dQty").value);if(!isFinite(q)||q<=0||q>5000){toast("Укажи количество");return;}
    const meal=document.getElementById("dMeal").value;addItem(meal,itemFromFood(f,q,unit));closeSheet();}
  else if(a==="food-del"){const id=sheet.food.id;deleteFood(id);sheet.view="search";sheet.food=null;renderSheet();toast("Продукт удалён");}
  else if(a==="cam")document.getElementById("camInput").click();
  else if(a==="scan-start")startScan();
  else if(a==="scan-stop"){stopScan();sheet.scan=null;renderSheet();}
  else if(a==="bc-find")lookupBarcode(document.getElementById("bcIn").value);
  else if(a==="range"){sheet.range=b.dataset.range;renderSheet();}
  else if(a==="md-copy"){const t=document.getElementById("mdOut");const done=()=>toast("Скопировано — вставь в Obsidian");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,()=>{t.select();document.execCommand("copy");done();});else{t.select();document.execCommand("copy");done();}}
  else if(a==="md-save"){download("kbju-"+(sheet.range||"week")+"-"+today()+".md",document.getElementById("mdOut").value,"text/markdown");toast("Файл сохранён в «Загрузки»");}
  else if(a==="restore-yes"){const o=sheet.restore.raw||sheet.restore;const lb=S.lastBackup;applySnapshot(o);S.lastBackup=o.saved||lb||Date.now();persist();closeSheet();renderMain();toast("Записи восстановлены");}
  else if(a==="manual-add"){
    const g=id=>document.getElementById(id).value;
    const d={name:g("mName").trim(),kcal:num(g("mK")),p:num(g("mP")),f:num(g("mF")),c:num(g("mC")),unitG:num(g("mUnitG")),qty:num(g("mQty"))};
    if(!d.name){toast("Впиши название");return;}
    if(!isFinite(d.kcal)){toast("Впиши калории на 100 г");return;}
    if(d.kcal<0||d.kcal>950||[d.p,d.f,d.c].some(x=>isFinite(x)&&(x<0||x>100))){toast("Проверь КБЖУ: калории 0–950, белки, жиры и углеводы 0–100 г на 100 г");return;}
    if(isFinite(d.p)&&isFinite(d.f)&&isFinite(d.c)&&d.p+d.f+d.c>100.5){toast("Белков, жиров и углеводов вместе не может быть больше 100 г на 100 г");return;}
    if(!isFinite(d.qty)||d.qty<=0||d.qty>5000){toast("Впиши, сколько граммов съел (до 5 кг)");return;}
    ["p","f","c"].forEach(k=>{if(!isFinite(d[k]))d[k]=0;});
    const food={id:"f"+uid(),name:d.name,kcal:d.kcal,p:d.p,f:d.f,c:d.c,unit:isFinite(d.unitG)&&d.unitG>0?"шт":null,unitG:isFinite(d.unitG)&&d.unitG>0?d.unitG:null,barcode:(sheet.draft&&sheet.draft.barcode)||null,created:Date.now()};
    if(document.getElementById("mSave").checked)saveFood(food);
    const it=itemFromFood(Object.assign({src:"custom"},food),d.qty,"g");
    addItem(sheet.meal,it);closeSheet();
  }
});
sroot.addEventListener("input",e=>{
  if(!sheet)return;
  if(sheet.view==="recipe"&&RD){
    const t=e.target;
    if(t.id==="rName")RD.name=t.value;
    else if(t.id==="rCooked")RD.cookedG=t.value;
    else if(t.id==="rPortions")RD.portions=t.value;
    else if(t.dataset.ri!=null){const i=RD.ingredients[Number(t.dataset.ri)];if(i){i.g=t.value;const g=num(t.value)||0;const k=document.getElementById("rk"+t.dataset.ri);if(k)k.textContent=r0(i.kcal*g/100);}}
    saveDraft();const tot=document.getElementById("rTot");if(tot)tot.innerHTML=recipeTotalsHtml();return;
  }
  if(e.target.id==="eQty"||e.target.id==="eMul"){const v=num(e.target.value);if(e.target.id==="eQty")sheet.eQty=isFinite(v)&&v>0?v:0;else sheet.eMul=isFinite(v)&&v>0?v:1;
    const it=(getDay(S.date).items||[]).find(i=>i.id===sheet.itemId);if(it)document.getElementById("ePrev").innerHTML=editPreview(it);return;}
  if(e.target.id==="q"){sheet.q=e.target.value;updateSearch();}
  else if(e.target.id==="dQty"){const f=sheet.food,unit=sheet.unit||(f.portion?"portion":"g"),q=num(e.target.value);sheet.qty=isFinite(q)?q:0;const k=unit==="portion"?sheet.qty:unit==="u"?sheet.qty*f.unitG/100:sheet.qty/100;document.getElementById("dPrev").innerHTML=previewHtml(f,k);}
  else if(sheet.view==="manual"&&e.target.id&&e.target.id.startsWith("m")){
    const map={mName:"name",mK:"kcal",mP:"p",mF:"f",mC:"c",mUnitG:"unitG",mPack:"pack",mQty:"qty"};const k=map[e.target.id];if(k){sheet.draft=sheet.draft||{};sheet.draft[k]=e.target.value;}
  }
});
sroot.addEventListener("change",e=>{if(e.target.id==="mSave"&&sheet&&sheet.draft)sheet.draft.save=e.target.checked;});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet();});
document.getElementById("camInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";scanPhoto(f);});
document.getElementById("restoreInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";readRestore(f);});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&scanStream&&sheet){stopScan();sheet.scan=null;renderSheet();}});

// midnight rollover: keep "today" fresh when the app stays open
let lastToday=today();
setInterval(()=>{const t=today();if(t!==lastToday){if(S.date===lastToday)S.date=t;lastToday=t;renderMain();}},60000);

loadStore();renderBanner();renderMain();
if(!S.settings.setupDone&&S.store!=="off"){sheet={meal:MEALS[0],view:"setup"};renderSheet();}
window.addEventListener("storage",e=>{if(e.key===KEY){loadStore();renderMain();}});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
